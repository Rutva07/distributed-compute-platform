name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/go.mod
      - name: Dependencies
        run: cd src && go mod tidy
      - name: Unit tests
        run: cd src && go test -race ./...
      - name: Static analysis
        run: cd src && go vet ./...
      - name: Compose integration
        run: |
          docker compose up -d --build --scale worker=2
          for i in $(seq 1 60); do curl -fsS localhost:8080/health/ready && break || sleep 2; done
          bash scripts/smoke.sh
          (cd src && INTEGRATION_URL=http://localhost:8080 go test -v ./integration)
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=150
      - name: Cleanup
        if: always()
        run: docker compose down -v
