apiVersion: batch/v1
kind: Job
metadata:
  name: compute-migrate
  namespace: compute
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: migrate
          image: compute-migrate:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: compute-config}
            - secretRef: {name: compute-secrets}
